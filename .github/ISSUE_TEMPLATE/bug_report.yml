name: Bug report
description: Report a reproducible bug.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please provide enough detail so we can reproduce quickly."
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: What failed?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, package version
    validations:
      required: true
